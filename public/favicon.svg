<!--
  Favicon TW4 — isotipo sobre lienzo cuadrado.
  El SVG original del isotipo es apaisado (938×449); usado tal cual, el navegador
  lo encaja en un cuadrado de 16px y las estrellas quedan ilegibles. Aquí van
  centradas sobre fondo Crimson, que es la combinación "Rojo / Blanco" del
  brandbook y la que mejor contrasta en la barra de pestañas.
-->
